<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9EAE6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="待辦板">
<title>群組待辦板</title>
<style>
  :root{
    --paper:#E9EAE6; --slip:#FCFCFA; --ink:#191C1A; --mute:#82867F;
    --line:#C9CBC4; --chop:#B7362B; --blue:#2B4257;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC",
            "Microsoft JhengHei", "Helvetica Neue", sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;
       line-height:1.5;-webkit-text-size-adjust:100%;padding-bottom:40px}
  button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
  input,textarea{font-family:inherit;font-size:16px;color:inherit}
  :focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
  [hidden]{display:none !important}

  .board{max-width:560px;margin:0 auto;padding:0 14px}

  .masthead{padding:22px 0 12px;display:flex;align-items:flex-start;gap:12px}
  .masthead h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
  .eyebrow{margin:0 0 4px;font-family:var(--mono);font-size:10px;letter-spacing:.22em;
           text-transform:uppercase;color:var(--mute)}
  .whoami{margin-left:auto;flex:none;background:transparent;border:1.5px solid var(--ink);
          border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;
          max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .meter{display:flex;align-items:center;gap:18px;border-top:2px solid var(--ink);
         border-bottom:1px solid var(--line);padding:8px 0;font-family:var(--mono);
         font-size:11px;letter-spacing:.06em;color:var(--mute)}
  .meter b{font-size:15px;color:var(--ink);letter-spacing:0}
  .meter .sync{margin-left:auto;background:none;border:0;padding:4px;font-family:var(--mono);
               font-size:11px;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
  .meter .sync.busy{text-decoration:none;opacity:.6}

  .composer{margin:14px 0}
  .add-toggle{width:100%;background:var(--ink);color:var(--paper);border:0;border-radius:3px;
              padding:14px;font-size:16px;font-weight:700;display:flex;align-items:center;
              justify-content:center;gap:8px}
  .add-toggle .plus{font-family:var(--mono);font-size:18px;line-height:1}
  .form{display:none;background:var(--slip);border:1.5px solid var(--ink);border-radius:3px;padding:14px}
  .form.open{display:block}
  .field{margin-bottom:10px}
  .field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;
               text-transform:uppercase;color:var(--mute);margin-bottom:5px}
  .field input,.field textarea{width:100%;background:transparent;border:0;
               border-bottom:1.5px solid var(--line);padding:7px 2px;border-radius:0}
  .field input:focus,.field textarea:focus{outline:0;border-bottom-color:var(--blue)}
  .field textarea{resize:vertical;min-height:52px;border:1.5px solid var(--line);padding:8px;border-radius:2px}
  .form-actions{display:flex;gap:8px;margin-top:14px}
  .btn{border:1.5px solid var(--ink);background:transparent;border-radius:3px;
       padding:11px 14px;font-weight:700;flex:1}
  .btn[disabled]{cursor:default}
  .btn-solid{background:var(--ink);color:var(--paper)}
  .btn-solid[disabled]{background:var(--line);border-color:var(--line);color:var(--slip)}

  .check{display:flex;align-items:center;gap:9px;padding:10px 2px;font-size:15px;
         font-weight:600;cursor:pointer;border-top:1px solid var(--line);margin-top:4px}
  .check input{width:20px;height:20px;accent-color:var(--ink);margin:0}
  .field select{width:100%;background:var(--slip);border:1.5px solid var(--line);
                border-radius:2px;padding:9px 8px;font-size:16px;color:inherit}
  .field select:focus{outline:0;border-color:var(--blue)}
  .hint{margin:2px 0 0;font-family:var(--mono);font-size:11px;color:var(--blue)}

  .rrow{display:flex;align-items:center;gap:9px;padding:11px 2px;
        border-bottom:1px dashed var(--line)}
  .rrow .cyc{flex:none;font-size:11px;font-weight:700;color:var(--blue);
             border:1px solid var(--blue);border-radius:2px;padding:1px 6px}
  .rrow .t{flex:1;min-width:0;font-size:15px;font-weight:600;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rrow .m{flex:none;font-family:var(--mono);font-size:10px;color:var(--mute)}
  .rrow .del{flex:none;background:none;border:0;padding:4px 6px;color:var(--chop);font-size:16px}
  .tag-rep{flex:none;font-size:10px;font-weight:700;color:var(--blue);
           border:1px solid var(--blue);border-radius:2px;padding:0 4px;margin-left:6px}
  .btn-quiet{border-color:var(--line);color:var(--mute);flex:0 0 auto;padding:11px 16px}
  .btn-danger{border-color:var(--chop);color:var(--chop)}

  .sec-label{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-family:var(--mono);
             font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
  .sec-label::after{content:"";flex:1;height:1px;background:var(--line)}

  .slip{display:flex;gap:12px;background:var(--slip);border:1.5px solid var(--ink);
        border-radius:3px;padding:12px;margin-bottom:10px}
  .tick{flex:none;width:30px;height:30px;margin-top:1px;background:transparent;
        border:2.5px solid var(--ink);border-radius:3px;padding:0}
  .tick:active{background:var(--line)}
  .slip-body{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
  .slip-top{display:flex;align-items:baseline;gap:8px}
  .no{font-family:var(--mono);font-size:11px;color:var(--mute);flex:none}
  .title{font-size:17px;font-weight:700;line-height:1.35;word-break:break-word}
  .site{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;color:var(--blue);
        border:1px solid var(--blue);border-radius:2px;padding:1px 6px}
  .byline{margin-top:7px;font-family:var(--mono);font-size:11px;color:var(--mute)}

  .done-head{width:100%;display:flex;align-items:center;gap:10px;background:transparent;border:0;
             border-top:1px solid var(--line);padding:14px 0;font-family:var(--mono);font-size:11px;
             letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
  .done-head .caret{margin-left:auto;font-size:12px;transition:transform .18s ease}
  .done-head[aria-expanded="true"] .caret{transform:rotate(180deg)}
  .done-list{display:none}
  .done-list.open{display:block}
  .drow{width:100%;display:flex;align-items:center;gap:9px;text-align:left;background:transparent;
        border:0;border-bottom:1px dashed var(--line);padding:11px 2px}
  .drow .t{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--mute);
           text-decoration:line-through;text-decoration-color:var(--line);
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .drow.trashed .t{text-decoration:none}
  .drow .m{font-family:var(--mono);font-size:10px;color:var(--mute);flex:none}
  .cam{flex:none;font-size:11px;color:var(--chop);font-weight:700}
  .ttl{flex:none;font-family:var(--mono);font-size:10px;color:var(--chop);
       border:1px solid var(--chop);border-radius:2px;padding:1px 4px}
  .bin{flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;
       border:1.5px dashed var(--mute);border-radius:3px;color:var(--mute);font-size:12px}

  .chop{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
        width:72px;height:72px;border:2.5px solid var(--chop);border-radius:5px;color:var(--chop);
        transform:rotate(-7deg);mix-blend-mode:multiply;box-shadow:inset 0 0 0 1px var(--chop);opacity:.9}
  .chop b{font-size:20px;font-weight:800;letter-spacing:.1em;line-height:1.1}
  .chop span{font-family:var(--mono);font-size:9px;line-height:1.3;margin-top:3px;text-align:center}
  .chop-sm{width:26px;height:26px;border-width:1.5px;box-shadow:none;border-radius:3px}
  .chop-sm b{font-size:11px;letter-spacing:0}
  @keyframes stamp{0%{transform:rotate(-7deg) scale(2.1);opacity:0}
                   60%{transform:rotate(-7deg) scale(.94);opacity:1}
                   100%{transform:rotate(-7deg) scale(1);opacity:.9}}
  .stamping{animation:stamp .34s cubic-bezier(.3,1.4,.5,1) both}

  .empty{border:1.5px dashed var(--line);border-radius:3px;padding:26px 16px;
         text-align:center;color:var(--mute);font-size:14px}

  .scrim{position:fixed;inset:0;background:rgba(25,28,26,.45);z-index:40}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow-y:auto;
         background:var(--paper);border-top:2.5px solid var(--ink);border-radius:10px 10px 0 0;
         padding:0 16px calc(20px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;
         animation:rise .2s ease-out both}
  @keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
  .sheet-head{position:sticky;top:0;background:var(--paper);padding:14px 0 10px;display:flex;
              align-items:center;gap:10px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .sheet-head h2{margin:0;font-size:15px;font-family:var(--mono);letter-spacing:.16em;
                 text-transform:uppercase;color:var(--mute);font-weight:600}
  .x{margin-left:auto;background:none;border:0;font-size:22px;line-height:1;padding:4px 6px;color:var(--mute)}
  .d-title{font-size:21px;font-weight:800;line-height:1.35;word-break:break-word}
  .d-desc{margin-top:10px;white-space:pre-wrap;font-size:15px}
  .stamp-row{display:flex;align-items:center;gap:14px;margin:16px 0;padding:12px;
             border:1px solid var(--line);border-radius:3px;background:var(--slip)}
  .stamp-row .who{font-size:15px;font-weight:700}
  .stamp-row .when{font-family:var(--mono);font-size:12px;color:var(--mute);margin-top:2px}
  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .photos img{width:100%;aspect-ratio:1;object-fit:cover;border:1px solid var(--ink);
              border-radius:2px;display:block;background:var(--line)}
  .photos button{padding:0;border:0;background:none}
  .photos a{font-size:12px;color:var(--blue)}
  .log{list-style:none;margin:0;padding:0;border-left:1.5px solid var(--line);margin-left:5px}
  .log li{position:relative;padding:0 0 14px 16px}
  .log li::before{content:"";position:absolute;left:-5.5px;top:6px;width:9px;height:9px;
                  border-radius:50%;background:var(--ink)}
  .log .lt{font-family:var(--mono);font-size:11px;color:var(--mute)}
  .log .lb{font-size:14px}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .thumbs figure{position:relative;margin:0}
  .thumbs img{width:74px;height:74px;object-fit:cover;border:1.5px solid var(--ink);
              border-radius:2px;display:block}
  .thumbs .rm{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;
              background:var(--ink);color:var(--paper);border:0;font-size:14px;line-height:1;padding:0}
  .filebtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
           border:1.5px dashed var(--ink);border-radius:3px;padding:16px;font-weight:700;background:transparent}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
  .actions .btn{flex:1 1 45%}

  .gate{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;align-items:center;
        justify-content:center;padding:24px}
  .gate .inner{width:100%;max-width:360px}
  .gate h2{margin:0 0 6px;font-size:22px}
  .gate p{margin:0 0 18px;color:var(--mute);font-size:14px;line-height:1.7}
  .gate code{font-family:var(--mono);font-size:12px;background:var(--slip);
             border:1px solid var(--line);padding:1px 5px;border-radius:2px;word-break:break-all}
  .people{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  .people button{border:2px solid var(--ink);background:transparent;border-radius:999px;
                 padding:10px 18px;font-weight:700;font-size:16px}
  .people button:active{background:var(--ink);color:var(--paper)}
  .or{margin:0 0 6px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;
      text-transform:uppercase;color:var(--mute)}
  .tip{margin:16px 0 0;font-size:13px;color:var(--mute);line-height:1.7}
  .tip button{background:none;border:0;padding:0;color:var(--blue);font-size:13px;font-weight:700;
              text-decoration:underline;text-underline-offset:3px}
  .guide .inner{max-width:400px;max-height:88vh;overflow-y:auto}
  .guide h2{margin-bottom:12px}
  .guide p{margin:0 0 14px;color:var(--ink);font-size:15px;line-height:1.75;text-align:left}
  .guide .hint{color:var(--mute);font-size:13px}
  .guide .sec-label{margin:18px 0 8px}
  .steps{margin:0 0 14px;padding-left:22px;font-size:15px;line-height:1.9;text-align:left}
  .steps li{margin-bottom:4px}

  #lightbox{position:fixed;inset:0;z-index:70;background:rgba(25,28,26,.94);display:flex;
            align-items:center;justify-content:center;padding:16px}
  #lightbox img{max-width:100%;max-height:86vh;object-fit:contain}

  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
         background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:999px;font-size:14px;
         font-weight:600;opacity:0;pointer-events:none;transition:all .22s ease;z-index:80;
         max-width:88vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .footnote{margin-top:26px;font-size:12px;color:var(--mute);line-height:1.7;
            border-top:1px solid var(--line);padding-top:12px}
  .footnote button{background:none;border:0;padding:0;color:var(--blue);font-size:12px;
                   text-decoration:underline;text-underline-offset:3px}

  /* 唯讀／編輯 */
  .whoami.lock{border-color:var(--blue);color:var(--blue)}
  .whoami.lock::before{content:"✎ ";}
  .ro-banner{margin:10px 0 0;padding:10px 12px;border:1.5px solid var(--blue);border-radius:3px;
             color:var(--blue);font-size:13px;line-height:1.6}
  .tick-off{display:block;opacity:.3;border-style:dashed}
  .slip.saving{opacity:.55}
  .ro-hint{margin-top:16px;color:var(--mute)}
  .err{margin:-6px 0 12px;color:var(--chop);font-size:13px;font-weight:700}
  .muted{color:var(--mute);font-size:13px;margin:0}

  /* 重複設定 */
  .repeat-box{border-top:1px solid var(--line);padding-top:10px}
  .seg{display:flex;border:1.5px solid var(--ink);border-radius:3px;overflow:hidden}
  .seg-b{flex:1;border:0;background:transparent;padding:9px 0;font-weight:700;font-size:15px}
  .seg-b + .seg-b{border-left:1.5px solid var(--ink)}
  .seg-b.on{background:var(--ink);color:var(--paper)}
  .row2{display:flex;gap:10px}
  .row2 .field{flex:1;min-width:0}
  .hint-note{color:var(--mute)}
  .rrow{width:100%;background:transparent;border:0;border-bottom:1px dashed var(--line);text-align:left}
  .rrow.paused .t,.rrow.paused .cyc{opacity:.5}
  #repeatList .rgroup{margin:16px 0 2px}
  #repeatList .rgroup:first-child{margin-top:4px}
  .facts{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:16px 0 4px;font-size:14px}
  .facts dt{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--mute);padding-top:3px}
  .facts dd{margin:0}
  .facts .cyc{font-size:12px;font-weight:700;color:var(--blue);border:1px solid var(--blue);
              border-radius:2px;padding:1px 6px}
  .lunar{display:block;font-size:12px;color:var(--mute);margin-top:2px}
  .paused-tag{font-size:11px;font-weight:700;color:var(--chop);border:1px solid var(--chop);
              border-radius:2px;padding:0 5px}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<div class="board" id="app" hidden>
  <header class="masthead">
    <div>
      <p class="eyebrow">Shared Task Board</p>
      <h1>群組待辦板</h1>
    </div>
    <button class="whoami" id="whoami">編輯</button>
  </header>

  <div class="meter">
    <span>待辦 <b id="mOpen">0</b></span>
    <span>完工 <b id="mDone">0</b></span>
    <button class="sync" id="sync">重新整理</button>
  </div>

  <p class="ro-banner" id="roBanner" hidden></p>

  <section class="composer">
    <button class="add-toggle" id="addToggle"><span class="plus">＋</span>新增待辦</button>
    <div class="form" id="form">
      <div class="field">
        <label for="fTitle">要做什麼</label>
        <input id="fTitle" type="text" autocomplete="off">
      </div>
      <div class="field">
        <label for="fSite">分類（可留空）</label>
        <input id="fSite" type="text" autocomplete="off">
      </div>
      <div class="field">
        <label for="fDesc">說明（可留空）</label>
        <textarea id="fDesc"></textarea>
      </div>

      <label class="check"><input type="checkbox" id="fRepeat"><span>重複</span></label>
      <div id="repeatBox" class="repeat-box" hidden></div>

      <div class="form-actions">
        <button class="btn btn-solid" id="fSave" disabled>加入待辦</button>
        <button class="btn btn-quiet" id="fCancel">取消</button>
      </div>
    </div>
  </section>

  <div class="sec-label">待辦中</div>
  <section id="openList"></section>

  <section>
    <button class="done-head" id="doneHead" aria-expanded="false">
      已完工 <b id="doneCount" style="color:var(--ink)">0</b> 件
      <span class="caret">▾</span>
    </button>
    <div class="done-list" id="doneList"></div>
  </section>

  <section id="repeatSection" hidden>
    <button class="done-head" id="repeatHead" aria-expanded="false">
      重複設定 <b id="repeatCount" style="color:var(--ink)">0</b> 項
      <span class="caret">▾</span>
    </button>
    <div class="done-list" id="repeatList"></div>
  </section>

  <section id="trashSection" hidden>
    <button class="done-head" id="trashHead" aria-expanded="false">
      刪除區 <b id="trashCount" style="color:var(--ink)">0</b> 件
      <span class="caret">▾</span>
    </button>
    <div class="done-list" id="trashList"></div>
  </section>

  <p class="footnote">
    大家看到的是同一份清單。資料存在建立者的 Google 試算表裡，照片存在他的雲端硬碟。<br>
    刪掉的東西會先進刪除區放 30 天，這段期間隨時可以還原，時間到才會真的消失。<br>
    拿到連結的人都看得到內容，但要有編輯密碼才能修改。不要在上面放個資。<br>
    <button id="howto">名字每次都不見？把板子加到主畫面</button>
  </p>
</div>

<div id="boot" class="gate"><div class="inner"><h2>載入中…</h2><p>正在連上待辦板。</p></div></div>
<div id="toast"></div>

<script src="config.js"></script>
<script>
(function(){
  'use strict';

  var API = (typeof BOARD_API === 'string') ? BOARD_API.trim() : '';
  var DAY = 86400000;
  var TRASH_DAYS = 30;

  var tasks = [];
  var repeats = [];
  var people = [];
  var me = '';
  var pw = '';                 // 編輯密碼（只有輸入過的人手機裡才有）
  var canEdit = false;         // 一律以後端的判斷為準
  var passwordSet = true;
  var serverToday = '';
  var overlayOpen = false;
  var pending = [];
  var busy = 0;
  var reqSeq = 0, lastWriteSeq = 0;

  /* ================= 農曆 =================
   * 表格涵蓋 1900–2100 年，以東經 120 度（台灣、中國共用的 UTC+8）計算。
   * 每個數字編碼一年：低 4 位元是閏月是第幾月（0 表示沒有閏月），
   * 第 5–16 位元依序是 1–12 月是大月（30 天）還是小月（29 天），第 17 位元是閏月大小。
   * 1933、2097 兩年依天文計算修正過；已逐日比對 1901–2100 共 73,049 天，與天文演算法一致。

  function lunarMonthDays(y, m) {

  function lunarYearDays(y) {

  function lunarYearStarts_() {

  /** 一年裡的農曆月份依序排出來，閏月排在同名月份後面。 */

  function ymdFromOffset_(off) {
    var d = new Date(LUNAR_BASE_UTC + off * 86400000);

  /** 國曆 → 農曆。回傳 {y, m, d, leap}；超出 1900–2100 回傳 null。 */
  function solarToLunar(Y, M, D) {
    var off = Math.round((Date.UTC(Y, M - 1, D) - LUNAR_BASE_UTC) / 86400000);
    if (off < 0) return null;
    var starts = lunarYearStarts_();
    var y = LUNAR_MIN;
    while (y < LUNAR_MAX && starts[y - LUNAR_MIN + 1] <= off) y++;
    var rest = off - starts[y - LUNAR_MIN];
    if (rest >= lunarYearDays(y)) return null;
    var months = lunarMonthsOf(y);
    for (var i = 0; i < months.length; i++) {
      if (rest < months[i].days) return { y: y, m: months[i].m, d: rest + 1, leap: months[i].leap };

    return null;

  /** 農曆 → 國曆。日子超過該月天數時，落在該月最後一天（例如三十遇到小月就是廿九）。 */
  function lunarToSolar(y, m, d, leap) {
    if (y < LUNAR_MIN || y > LUNAR_MAX) return null;
    if (leap && lunarLeapMonth(y) !== m) return null;
    var off = lunarYearStarts_()[y - LUNAR_MIN];
    var months = lunarMonthsOf(y);
    for (var i = 0; i < months.length; i++) {
      var mo = months[i];
      if (mo.m === m && mo.leap === !!leap) {

  var LUNAR_MONTH_NAMES = ['', '正月', '二月', '三月', '四月', '五月', '六月',

  function lunarDayName(d) {
    var n = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
    if (d <= 10) return '初' + n[d];
    if (d < 20) return '十' + n[d - 10];
    if (d === 20) return '二十';
    if (d < 30) return '廿' + n[d - 20];

  /** 以 {y,m,d} 比大小 */
  function ymdKey_(o) { return o.y * 10000 + o.m * 100 + o.d; }

  /**

  function nextLunarMonthly(D, from) {

  /** 從某天（含當天）起，下一個農曆每年 M 月 D 日。只認正常月份，不在閏月重複一次。 */
  function nextLunarYearly(M, D, from) {
    var cur = solarToLunar(from.y, from.m, from.d);
    if (!cur) return null;
    var fromKey = ymdKey_(from);
    for (var y = cur.y - 1; y <= Math.min(cur.y + 2, LUNAR_MAX); y++) {

      var s = lunarToSolar(y, M, D, false);
      if (s && ymdKey_(s) >= fromKey) return s;
    }

  var WEEK_SHORT = ['日','一','二','三','四','五','六'];
  function ymd(s){

  function addDaysYmd(o, n){

  /* ---------- 重複規則（和後端同一套算法） ---------- */
  var WEEKDAYS = ['','星期一','星期二','星期三','星期四','星期五','星期六','星期日'];

  function ruleLabel(r){
    var W = ['', '週一', '週二', '週三', '週四', '週五', '週六', '週日'];
    if(r.freq==='每天') return '每天';
    if(r.freq==='每週') return '每'+W[r.weekday];
    if(r.freq==='每月') return r.cal==='L' ? '每月 農曆'+lunarDayName(r.day) : '每月 '+r.day+' 號';
    if(r.freq==='每年') return r.cal==='L'
      ? '每年 農曆'+LUNAR_MONTH_NAMES[r.month]+lunarDayName(r.day)
      : '每年 '+r.month+' 月 '+r.day+' 日';
    return r.freq;
  }
  function nextOcc(r, from){
    if(r.freq==='每天') return from;
    if(r.freq==='每週'){
      var d = from;
      for(var i=0;i<7;i++){ if(weekdayOf(d) === r.weekday%7) return d; d = addDaysYmd(d,1); }
      return from;
    }
    if(r.freq==='每月'){
      if(r.cal==='L') return nextLunarMonthly(r.day, from);
      var y=from.y, m=from.m;
      for(var k=0;k<24;k++){
        var c = { y:y, m:m, d:Math.min(r.day, dim(y,m)) };
        if(cmpYmd(c, from) >= 0) return c;
        m++; if(m>12){ m=1; y++; }

      return from;
    }
    if(r.freq==='每年'){
      if(r.cal==='L') return nextLunarYearly(r.month, r.day, from);
      for(var j=0;j<4;j++){

        if(cmpYmd(c2, from) >= 0) return c2;

  }
  /** 規則的小提醒：遇到沒有那一天的月份會怎麼處理 */
  function ruleCaveat(r){
    if(r.cal==='L'){
      if(r.freq==='每年' && r.month===12 && r.day===30) return '農曆十二月沒有三十的年份，會在廿九出現——也就是每年的除夕。';
      if(r.day===30) return '農曆小月沒有三十，那個月會在廿九出現。';
      if(r.freq==='每月') return '閏月也會出現。';
      return '';
    }
    if(r.freq==='每月' && r.day>=29) return '沒有 '+r.day+' 號的月份，會在月底出現。';
    if(r.freq==='每年' && r.month===2 && r.day===29) return '平年沒有 2/29，會在 2/28 出現。';
    if(r.freq==='每年' && r.day>dim(2024, r.month)) return r.month+' 月沒有 '+r.day+' 號，會在 '+r.month+'/'+dim(2024,r.month)+' 出現。';

  /**

  function repeatFieldsHTML(p){

  function bindRepeatFields(root, p, init){
    var q = function(s){ return root.querySelector('#'+p+s); };
    var freq=q('Freq'), wk=q('Weekday'), mon=q('Month'), day=q('Day'), hint=q('Hint');
    var segs = root.querySelectorAll('#'+p+'CalField .seg-b');
    var cal = (init && init.cal) || 'G';

    var opts = '';
    for(var i=1;i<=7;i++) opts += '<option value="'+i+'">'+WEEKDAYS[i]+'</option>';
    wk.innerHTML = opts;

    function fillMD(){
      var keepM = mon.value, keepD = day.value, o='', i;
      for(i=1;i<=12;i++) o += '<option value="'+i+'">'+(cal==='L' ? LUNAR_MONTH_NAMES[i] : i+' 月')+'</option>';
      mon.innerHTML = o;
      o='';
      var maxD = cal==='L' ? 30 : 31;
      for(i=1;i<=maxD;i++) o += '<option value="'+i+'">'+(cal==='L' ? lunarDayName(i) : i+' 號')+'</option>';
      day.innerHTML = o;
      if(keepM) mon.value = keepM;
      if(keepD) day.value = String(Math.min(Number(keepD), maxD));
      root.querySelector('label[for="'+p+'Day"]').textContent = cal==='L' ? '農曆哪一天' : '幾號';
      root.querySelector('label[for="'+p+'Month"]').textContent = cal==='L' ? '農曆幾月' : '幾月';
    }

    // 預設值：有舊設定用舊的，沒有就用今天
    var t = todayYmd(), tl = solarToLunar(t.y, t.m, t.d) || { m:1, d:1 };
    freq.value = (init && init.freq) || '每月';
    fillMD();
    wk.value = String((init && init.weekday) || (weekdayOf(t) || 7));
    if(init && init.month){ mon.value = String(init.month); }
    else { mon.value = String(cal==='L' ? tl.m : t.m); }
    if(init && init.day){ day.value = String(init.day); }
    else { day.value = String(cal==='L' ? tl.d : t.d); }

    function get(){
      var r = { freq:freq.value, cal:'G', weekday:0, month:0, day:0 };
      if(r.freq==='每月' || r.freq==='每年') r.cal = cal;
      if(r.freq==='每週') r.weekday = Number(wk.value);
      if(r.freq==='每月' || r.freq==='每年') r.day = Number(day.value);
      if(r.freq==='每年') r.month = Number(mon.value);
      return r;
    }
    function sync(){
      var f = freq.value;
      q('CalField').hidden = !(f==='每月' || f==='每年');
      q('WkField').hidden = f!=='每週';
      q('MonField').hidden = f!=='每年';
      q('DayField').hidden = !(f==='每月' || f==='每年');
      segs.forEach(function(b){
        var on = b.getAttribute('data-cal') === cal;
        b.classList.toggle('on', on);
        b.setAttribute('aria-checked', on ? 'true' : 'false');
      });
      var r = get(), n = nextOcc(r, todayYmd());
      var lunar = n ? solarToLunar(n.y, n.m, n.d) : null;
      var cav = ruleCaveat(r);
      hint.innerHTML = esc(ruleLabel(r)) + (n ? ' · 下次 ' + esc(showYmd(n, n.y !== todayYmd().y))
        + (r.cal==='L' && lunar ? '（農曆'+esc(lunarText(lunar))+'）' : '') : '')
        + (cav ? '<br><span class="hint-note">'+esc(cav)+'</span>' : '');
    }
    segs.forEach(function(b){
      b.addEventListener('click', function(){
        var to = b.getAttribute('data-cal');
        if(to === cal) return;
        // 切換曆法時，把日子換成「今天」在新曆法裡的日子，比較不會選到奇怪的日期
        cal = to;
        fillMD();
        if(cal==='L'){ mon.value = String(tl.m); day.value = String(tl.d); }
        else { mon.value = String(t.m); day.value = String(t.d); }
        sync();
      });
    });
    [freq, wk, mon, day].forEach(function(el){ el.addEventListener('change', sync); });
    sync();
    return { get:get, sync:sync };
  }

  function api(action, payload, opts){

    }).then(function(r){ return r.json(); }).then(function(d){
      if(!d || !d.ok){
        var err = new Error((d && d.error) || '後端沒有回應');
        err.readOnly = !!(d && d.readOnly);
        err.wrongPassword = !!(d && d.wrongPassword);
        throw err;
      }
      return d;
    }).catch(function(e){
      if(e instanceof TypeError) throw new Error('連不上後端，請檢查網路');
      if(e.readOnly) dropEdit(e.message);
      throw e;
    }).then(function(v){ markBusy(false); return v; },
            function(e){ markBusy(false); throw e; });
  }

  function applyBoard(d){
    if(!d || !d.tasks) return d;
    tasks = d.tasks;
    repeats = d.repeats || [];
    people = d.people || [];
    if(d.today) serverToday = d.today;
    if(d.trashDays) TRASH_DAYS = d.trashDays;
    if(typeof d.passwordSet === 'boolean') passwordSet = d.passwordSet;
    if(typeof d.canEdit === 'boolean'){
      if(pw && !d.canEdit){
        // 存著的密碼已經不對了（例如密碼換了），清掉，回到唯讀
        pw = ''; keep('boardPw', '');
        toast('編輯密碼已經變更，請重新輸入');
      }
      canEdit = d.canEdit;
    }
    applyMode();
    return d;
  }

  /**
   * 讀取清單。如果讀取期間有人送出修改，這次讀到的可能是改之前的舊資料，直接丟掉，
   * 不然畫面會閃回舊狀態。
   */
  function refresh(){
    var mine = ++reqSeq;
    return api('list').then(function(d){
      if(mine < lastWriteSeq) return d;
      return applyBoard(d);
    });
  }

  /**
   * 先改畫面再送出，讓操作看起來是即時的。
   * 萬一失敗就整包還原成送出前的樣子，不會留下假的狀態。
   */
  function act(action, payload, localChange){
    lastWriteSeq = ++reqSeq;
    var backup = JSON.stringify({ t: tasks, r: repeats });
    if(localChange){ localChange(); render(); }
    return api(action, payload).then(applyBoard).catch(function(e){
      var b = JSON.parse(backup);
      tasks = b.t; repeats = b.r;
      render();
      throw e;
    });
  }
  function write(action, payload){
    lastWriteSeq = ++reqSeq;
    return api(action, payload).then(applyBoard);
  }

  function patch(id, changes){
    tasks = tasks.map(function(t){
      if(t.id !== id) return t;
      var next = {};
      for(var k in t){ next[k] = t[k]; }
      for(var c in changes){ next[c] = changes[c]; }
      return next;
    });
  }

  /* ---------- 編輯權限 ---------- */

      : '目前還沒有設定編輯密碼，所有人都只能看。';

  function dropEdit(msg){
    if(!canEdit && !pw) return;
    canEdit = false;
    pw = ''; keep('boardPw', '');
    closeOverlay();
    applyMode();

  }

  function askPassword(){
    var g=document.createElement('div');
    g.className='gate';
    g.innerHTML='<div class="inner"><h2>輸入編輯密碼</h2>'
      +'<p>有密碼才能新增、勾完工、修改。沒有密碼的人一樣看得到全部內容。</p>'
      +'<div class="field"><label for="gPw">編輯密碼</label>'
      +'<input id="gPw" type="password" autocomplete="current-password"></div>'
      +'<p class="err" id="gPwErr" hidden></p>'
      +'<div class="form-actions"><button class="btn btn-solid" id="gPwGo" disabled>進入編輯</button>'
      +'<button class="btn btn-quiet" id="gPwCancel">取消</button></div></div>';
    document.body.appendChild(g);
    var input=g.querySelector('#gPw'), go=g.querySelector('#gPwGo'), err=g.querySelector('#gPwErr');
    setTimeout(function(){ input.focus(); },60);
    input.addEventListener('input', function(){ go.disabled = !input.value; err.hidden = true; });

    function submit(){
      var v = input.value;
      if(!v) return;
      go.disabled = true; go.textContent = '確認中…';
      api('auth', {}, { pw: v }).then(function(){
        pw = v; keep('boardPw', v);
        canEdit = true;
        g.remove();
        applyMode();
        toast('已進入編輯模式');
        if(!me) askName(true);
        refresh().catch(function(){});
      }).catch(function(e){
        go.disabled = false; go.textContent = '進入編輯';
        err.textContent = e.message; err.hidden = false;
        input.select();
      });
    }
    go.addEventListener('click', submit);
    input.addEventListener('keydown', function(e){
      if(e.key==='Enter' && !e.isComposing && e.keyCode !== 229) submit();
    });
    g.querySelector('#gPwCancel').addEventListener('click', function(){ g.remove(); });
  }

  /* ---------- 照片 ---------- */
  function readFile(file){
    return new Promise(function(res, rej){
      var r=new FileReader();
      r.onload=function(){ res(r.result); };
      r.onerror=function(){ rej(new Error('讀不到這張照片')); };
      r.readAsDataURL(file);
    });
  }
  function shrink(file){
    return readFile(file).then(function(url){
      return new Promise(function(res, rej){
        var img=new Image();
        img.onload=function(){ res(img); };
        img.onerror=function(){ rej(new Error('這個檔案不是照片')); };
        img.src=url;
      });
    }).then(function(img){
      var max=1400, w=img.width, h=img.height;
      var s=Math.min(1, max/Math.max(w,h));
      w=Math.max(1,Math.round(w*s)); h=Math.max(1,Math.round(h*s));
      var c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      var q=0.72, out=c.toDataURL('image/jpeg',q);
      while(out.length > 520*1024 && q > 0.32){ q-=0.1; out=c.toDataURL('image/jpeg',q); }
      return out;
    });
  }

  /* ---------- 畫面 ---------- */
  function chopHTML(t, small){
    if(small) return '<span class="chop chop-sm"><b>完</b></span>';
    return '<span class="chop"><b>完工</b><span>'+esc(t.doneBy)+'<br>'+fmt(t.doneAt)+'</span></span>';
  }
  function isTmp(t){ return String(t.id).indexOf('tmp_') === 0; }
  function slipHTML(t){
    // 還沒存好的待辦先不給點，不然會對著一個還不存在的編號操作
    if(isTmp(t)){
      return '<article class="slip saving"><span class="tick tick-off" aria-hidden="true"></span>'
        + '<div class="slip-body"><span class="slip-top"><span class="no">#··</span>'
        + '<span class="title">'+esc(t.title)+'</span></span>'
        + '<div class="byline">儲存中…</div></div></article>';
    }
    return '<article class="slip">'
      + (canEdit
          ? '<button class="tick" data-tick="'+t.id+'" aria-label="標記完工：'+esc(t.title)+'"></button>'
          : '<span class="tick tick-off" aria-hidden="true"></span>')
      + '<button class="slip-body" data-open="'+t.id+'">'
      + '<span class="slip-top"><span class="no">#'+pad(t.no)+'</span>'
      + '<span class="title">'+esc(t.title)
      + (t.logs[0] && t.logs[0].action === '自動建立' ? '<span class="tag-rep">重複</span>' : '')
      + '</span></span>'
      + (t.site ? '<span class="site">'+esc(t.site)+'</span>' : '')
      + '<div class="byline">'+esc(t.createdBy)+' · '+fmt(t.createdAt)+' 建立'
      + (t.logs.length>1 ? ' · 紀錄 '+t.logs.length : '')+'</div>'
      + '</button></article>';
  }
  function doneRowHTML(t){
    return '<button class="drow" data-open="'+t.id+'">'
      + chopHTML(t, true)
      + '<span class="t">'+esc(t.title)+'</span>'
      + (t.photos.length ? '<span class="cam">照 '+t.photos.length+'</span>' : '')
      + '<span class="m">'+esc(t.doneBy)+' '+fmt(t.doneAt)+'</span></button>';
  }
  function daysLeft(t){
    return Math.max(0, Math.ceil((t.deletedAt + TRASH_DAYS*DAY - Date.now()) / DAY));
  }
  function trashRowHTML(t){
    var d = daysLeft(t);
    return '<button class="drow trashed" data-open="'+t.id+'">'
      + '<span class="bin">✕</span>'
      + '<span class="t">'+esc(t.title)+'</span>'
      + '<span class="ttl">'+(d>0 ? d+' 天' : '今天')+'</span>'
      + '<span class="m">'+esc(t.deletedBy||'')+'</span></button>';
  }
  function repeatRowHTML(r){
    var n = ymd(r.next);
    return '<button class="rrow'+(r.paused?' paused':'')+'" data-repeat="'+r.id+'">'
      + '<span class="cyc">'+esc(r.label)+'</span>'
      + '<span class="t">'+esc(r.title)+'</span>'
      + '<span class="m">'+(r.paused ? '暫停中' : (n ? '下次 '+n.m+'/'+n.d : ''))+'</span>'
      + '</button>';
  }

  function render(){
    var open = tasks.filter(function(t){ return t.status==='open'; })
                    .sort(function(a,b){ return b.createdAt-a.createdAt; });
    var done = tasks.filter(function(t){ return t.status==='done'; })
                    .sort(function(a,b){ return b.doneAt-a.doneAt; });
    var trash = tasks.filter(function(t){ return t.status==='trash'; })
                     .sort(function(a,b){ return b.deletedAt-a.deletedAt; });

    $('mOpen').textContent = open.length;
    $('mDone').textContent = done.length;
    $('doneCount').textContent = done.length;
    $('trashCount').textContent = trash.length;
    $('trashSection').hidden = trash.length === 0;

    $('openList').innerHTML = open.length ? open.map(slipHTML).join('')
      : '<div class="empty">目前沒有待辦。'+(canEdit ? '<br>按上面「新增待辦」開一件。' : '')+'</div>';
    $('doneList').innerHTML = done.length ? done.map(doneRowHTML).join('')
      : '<div class="empty">還沒有完工的項目。</div>';
    $('trashList').innerHTML = trash.map(trashRowHTML).join('');

    $('repeatCount').textContent = repeats.length;
    $('repeatSection').hidden = repeats.length === 0;
    $('repeatList').innerHTML = repeatGroupsHTML();
  }

  /** 重複設定：國曆、農曆分開，各自照下次出現的日期排（暫停的排在最後） */
  function repeatSortKey(r){
    var n = ymd(r.next) || nextOcc(r, todayYmd());
    return (r.paused ? 1e8 : 0) + n.y*10000 + n.m*100 + n.d;
  }
  function repeatGroupsHTML(){
    var groups = [['G', '國曆'], ['L', '農曆']];
    return groups.map(function(g){
      var list = repeats.filter(function(r){ return (r.cal === 'L' ? 'L' : 'G') === g[0]; })
        .sort(function(a, b){ return repeatSortKey(a) - repeatSortKey(b) || a.no - b.no; });
      if(!list.length) return '';
      return '<div class="sec-label rgroup">'+g[1]+' · '+list.length+'</div>'
        + list.map(repeatRowHTML).join('');
    }).join('');
  }

  function byId(id){
    for(var i=0;i<tasks.length;i++){ if(tasks[i].id===id) return tasks[i]; }
    return null;
  }
  function repeatById(id){
    for(var i=0;i<repeats.length;i++){ if(repeats[i].id===id) return repeats[i]; }
    return null;
  }

  /* ---------- 彈出層 ---------- */
  function closeOverlay(){
    var s=$('scrim'), sh=$('sheet');
    if(s) s.remove();
    if(sh) sh.remove();
    overlayOpen=false;
  }
  function openSheet(head, bodyHTML){
    closeOverlay();
    var scrim=document.createElement('div');
    scrim.className='scrim'; scrim.id='scrim';
    scrim.addEventListener('click', closeOverlay);
    var sheet=document.createElement('div');
    sheet.className='sheet'; sheet.id='sheet';
    sheet.innerHTML='<div class="sheet-head"><h2>'+esc(head)+'</h2>'
      +'<button class="x" data-close="1" aria-label="關閉">×</button></div>'+bodyHTML;
    document.body.appendChild(scrim);
    document.body.appendChild(sheet);
    overlayOpen=true;
    return sheet;
  }

  function logHTML(logs){
    if(!logs.length) return '<p class="muted">還沒有紀錄。</p>';
    return '<ul class="log">' + logs.slice().sort(function(a,b){ return a.at-b.at; }).map(function(l){
      return '<li><div class="lt">'+fmtFull(l.at)+'</div><div class="lb"><b>'+esc(l.who)+'</b> '
        + esc(l.action) + (l.text?'：'+esc(l.text):'')+'</div></li>';
    }).join('') + '</ul>';
  }

  function drawThumbs(sheet){
    var box=sheet.querySelector('#thumbs');
    box.innerHTML = pending.map(function(u,i){
      return '<figure><img src="'+u+'" alt="完工照 '+(i+1)+'">'
        +'<button class="rm" data-rm="'+i+'" aria-label="移除這張">×</button></figure>';
    }).join('');
    box.querySelectorAll('[data-rm]').forEach(function(b){
      b.addEventListener('click', function(){
        pending.splice(parseInt(b.getAttribute('data-rm'),10),1);
        drawThumbs(sheet);
      });
    });
  }

  function askComplete(id){
    var t=byId(id);
    if(!t || !canEdit) return;
    pending=[];
    var sheet=openSheet('標記完工',
        '<div class="d-title">'+esc(t.title)+'</div>'
      + (t.site?'<span class="site">'+esc(t.site)+'</span>':'')
      + '<div class="sec-label" style="margin-top:18px">完工照</div>'
      + '<button class="filebtn" id="pick">＋ 拍照或選照片</button>'
      + '<input type="file" id="file" accept="image/*" multiple hidden>'
      + '<div class="thumbs" id="thumbs"></div>'
      + '<div class="field" style="margin-top:18px"><label for="cNote">完工備註（可留空）</label>'
      + '<textarea id="cNote"></textarea></div>'
      + '<div class="actions"><button class="btn btn-solid" id="cGo">確認完工</button>'
      + '<button class="btn btn-quiet" data-close="1">先不要</button></div>');

    var file=sheet.querySelector('#file');
    sheet.querySelector('#pick').addEventListener('click', function(){ file.click(); });
    file.addEventListener('change', function(){
      var files=Array.prototype.slice.call(file.files||[]);
      file.value='';
      if(!files.length) return;
      if(pending.length+files.length>6){
        toast('一次最多 6 張');
        files=files.slice(0, Math.max(0, 6-pending.length));
      }
      toast('照片處理中…');
      Promise.all(files.map(shrink)).then(function(list){
        pending=pending.concat(list);
        drawThumbs(sheet);
      }).catch(function(e){ toast(e.message||'照片處理失敗'); });
    });

    sheet.querySelector('#cGo').addEventListener('click', function(){
      var note = sheet.querySelector('#cNote').value.trim();
      var shots = pending.slice();
      var btn = this;

      // 沒照片就直接讓畫面動起來，存檔在背景跑
      if(!shots.length){
        closeOverlay();
        openDoneSection();
        act('done', { id:id, note:note, photos:[] }, function(){
          patch(id, { status:'done', doneBy: whoami(), doneAt: Date.now(), doneNote: note });
        }).then(function(){ stampNewest(); toast('已完工'); })
          .catch(function(e){ toast(e.message); });
        return;
      }

      // 有照片就得等它真的傳完，不能先騙使用者說好了
      btn.disabled = true;
      btn.textContent = '上傳中…';
      pending = [];
      write('done', { id:id, note:note, photos:shots })
        .then(function(){
          closeOverlay();
          openDoneSection();
          stampNewest();
          toast('已完工');
        })
        .catch(function(e){
          pending = shots;
          btn.disabled = false;
          btn.textContent = '確認完工';
          toast(e.message);
        });
    });
  }

  function openDoneSection(){
    var head = $('doneHead');
    if(head.getAttribute('aria-expanded') !== 'true') head.click();
  }
  function stampNewest(){
    var first = $('doneList').querySelector('.chop-sm');
    if(first) first.classList.add('stamping');
  }

  /** draft：上次沒存成功的內容，重開時帶回來，不讓使用者重打 */
  function openEdit(id, draft){
    var t = byId(id);
    if(!t || !canEdit) return;
    var sheet = openSheet('編輯待辦',
        '<div class="field"><label for="eTitle">要做什麼</label>'
      + '<input id="eTitle" type="text" autocomplete="off"></div>'
      + '<div class="field"><label for="eSite">分類（可留空）</label>'
      + '<input id="eSite" type="text" autocomplete="off"></div>'
      + '<div class="field"><label for="eDesc">說明（可留空）</label>'
      + '<textarea id="eDesc"></textarea></div>'
      + '<p class="hint">改了什麼會記在案件紀錄裡，包含被蓋掉的舊內容。</p>'
      + '<div class="actions"><button class="btn btn-solid" id="eSave">儲存修改</button>'
      + '<button class="btn btn-quiet" data-close="1">取消</button></div>');

    var ti = sheet.querySelector('#eTitle');
    var si = sheet.querySelector('#eSite');
    var di = sheet.querySelector('#eDesc');
    ti.value = draft ? draft.title : t.title;
    si.value = draft ? draft.site : (t.site || '');
    di.value = draft ? draft.desc : (t.desc || '');

    function sync(){ sheet.querySelector('#eSave').disabled = !ti.value.trim(); }
    ti.addEventListener('input', sync);
    sync();

    sheet.querySelector('#eSave').addEventListener('click', function(){
      var title = ti.value.trim(), site = si.value.trim(), desc = di.value.trim();
      if(!title){ toast('標題不能空白'); return; }
      if(title === t.title && site === (t.site||'') && desc === (t.desc||'')){
        closeOverlay(); openDetail(id);
        return;
      }
      var d = { title:title, site:site, desc:desc };
      closeOverlay();
      act('edit', { id:id, title:title, site:site, desc:desc }, function(){
        patch(id, {
          title: title, site: site, desc: desc,
          logs: byId(id).logs.concat([{ at:Date.now(), who:whoami(), action:'修改', text:'儲存中…' }])
        });
      }).then(function(){ openDetail(id); toast('已更新'); })
        .catch(function(e){ toast(e.message + '，剛才改的內容還在'); if(canEdit) openEdit(id, d); });
    });
  }

  function openDetail(id){
    var t=byId(id);
    if(!t || isTmp(t)) return;
    var body='<div class="d-title"><span class="no">#'+pad(t.no)+'</span> '+esc(t.title)+'</div>'
      + (t.site?'<span class="site">'+esc(t.site)+'</span>':'')
      + (t.desc?'<div class="d-desc">'+esc(t.desc)+'</div>':'');

    if(t.status==='done'){
      body += '<div class="stamp-row">'+chopHTML(t,false)
        + '<div><div class="who">'+esc(t.doneBy)+' 勾選完工</div>'
        + '<div class="when">'+fmtFull(t.doneAt)+'</div>'
        + (t.doneNote?'<div style="margin-top:6px;font-size:14px">'+esc(t.doneNote)+'</div>':'')
        + '</div></div>';

    body += '<div class="sec-label">完工照 '+t.photos.length+'</div><div class="photos">'

      + '</div>';

    if(!canEdit){
      body += '<p class="hint ro-hint">唯讀檢視，只能看不能改。</p>';
    } else if(t.status==='trash'){
      body += '<div class="actions"><button class="btn btn-solid" id="restore">還原這件</button></div>';
    } else {
      body += '<div class="field" style="margin-top:6px"><label for="nNote">加一筆紀錄</label>'
        + '<textarea id="nNote"></textarea>'

        + '<button class="btn" id="addPhoto">＋ 補上照片</button>'
        + (t.status==='done' ? '<button class="btn" id="reopen">退回待辦</button>'
                             : '<button class="btn btn-solid" id="markDone">標記完工</button>')
        + '<button class="btn btn-danger" id="del">移到刪除區</button></div>'
        + '<input type="file" id="file2" accept="image/*" multiple hidden>';
    }

    var head = t.status==='trash' ? ('刪除區 · 剩 '+daysLeft(t)+' 天')
                                  : (t.status==='done' ? '已完工' : '待辦中');
    var sheet=openSheet(head, body);

    sheet.querySelectorAll('[data-zoom]').forEach(function(b){
      b.addEventListener('click', function(){
        var box=document.createElement('div');
        box.id='lightbox';
        box.innerHTML='<img src="'+esc(b.getAttribute('data-zoom'))+'" alt="完工照放大">';
        box.addEventListener('click', function(){ box.remove(); });
        document.body.appendChild(box);
      });
    });

    if(!canEdit) return;

    var rs=sheet.querySelector('#restore');
    if(rs) rs.addEventListener('click', function(){
      this.disabled=true;
      closeOverlay();
      act('restore', {id:id}, function(){
        patch(id, { status: t.doneAt ? 'done' : 'open', deletedAt: 0, deletedBy: '' });
      }).then(function(){ toast('已還原'); })
        .catch(function(e){ toast(e.message); });
    });

    if(t.status==='trash') return;

    sheet.querySelector('#nGo').addEventListener('click', function(){
      var btn = this;
      var v=sheet.querySelector('#nNote').value.trim();
      if(!v){ toast('先寫點東西'); return; }
      btn.disabled=true;
      act('note', {id:id, text:v}, function(){
        patch(id, { logs: byId(id).logs.concat([{ at:Date.now(), who:whoami(), action:'留言', text:v }]) });
      }).then(function(){ openDetail(id); toast('已加入紀錄'); })
        .catch(function(e){ btn.disabled=false; toast(e.message); });
    });

    var f2=sheet.querySelector('#file2');
    sheet.querySelector('#addPhoto').addEventListener('click', function(){ f2.click(); });
    f2.addEventListener('change', function(){
      var files=Array.prototype.slice.call(f2.files||[]).slice(0,6);
      f2.value='';
      if(!files.length) return;
      toast('照片上傳中…');
      Promise.all(files.map(shrink))
        .then(function(list){ return write('photos',{id:id, photos:list}); })
        .then(function(){ openDetail(id); toast('照片已上傳'); })
        .catch(function(e){ toast(e.message||'照片上傳失敗'); });
    });

    sheet.querySelector('#edit').addEventListener('click', function(){ openEdit(id); });

    var md=sheet.querySelector('#markDone');
    if(md) md.addEventListener('click', function(){ askComplete(id); });

    var ro=sheet.querySelector('#reopen');
    if(ro) ro.addEventListener('click', function(){
      this.disabled=true;
      closeOverlay();
      act('reopen', {id:id}, function(){
        patch(id, { status:'open', doneBy:'', doneAt:0, doneNote:'' });
      }).then(function(){ toast('已退回待辦'); })
        .catch(function(e){ toast(e.message); });
    });

    sheet.querySelector('#del').addEventListener('click', function(){
      if(!confirm('把「'+t.title+'」移到刪除區？\n\n30 天內都可以還原，時間到才會真的刪掉。')) return;
      closeOverlay();
      var th = $('trashHead');
      if(th.getAttribute('aria-expanded') !== 'true') th.click();
      act('trash', {id:id}, function(){
        patch(id, { status:'trash', deletedAt: Date.now(), deletedBy: whoami() });
      }).then(function(){ toast('已移到刪除區，30 天內可還原'); })
        .catch(function(e){ toast(e.message); });
    });
  }

  /* ---------- 重複設定：明細與編輯 ---------- */
  function openRepeat(id){
    var r = repeatById(id);
    if(!r) return;
    var n = ymd(r.next);
    var body = '<div class="d-title">'+esc(r.title)+'</div>'
      + (r.site?'<span class="site">'+esc(r.site)+'</span>':'')
      + (r.desc?'<div class="d-desc">'+esc(r.desc)+'</div>':'')
      + '<dl class="facts">'
      + '<dt>週期</dt><dd><span class="cyc">'+esc(r.label)+'</span>'
      + (r.paused ? ' <span class="paused-tag">暫停中</span>' : '')+'</dd>'
      + '<dt>下次出現</dt><dd>'
      + (r.paused ? '暫停中，不會自動產生'
          : (n ? esc(showYmd(n, true)) + (r.nextLunar ? '<span class="lunar">農曆'+esc(r.nextLunar)+'</span>' : '') : '—'))
      + '</dd>'
      + '<dt>建立</dt><dd>'+esc(r.by)+(r.at ? ' · '+fmtFull(r.at) : '')+'</dd>'
      + (r.editBy ? '<dt>最後修改</dt><dd>'+esc(r.editBy)+' · '+fmtFull(r.editAt)+'</dd>' : '')
      + '</dl>'
      + '<div class="sec-label">設定紀錄</div>' + logHTML(r.logs || []);

    body += canEdit
      ? '<div class="actions"><button class="btn btn-solid" id="rEdit">編輯設定</button>'
        + '<button class="btn btn-danger" id="rDel">刪除這項設定</button></div>'
      : '<p class="hint ro-hint">唯讀檢視，只能看不能改。</p>';

    var sheet = openSheet('重複設定', body);
    if(!canEdit) return;

    sheet.querySelector('#rEdit').addEventListener('click', function(){ openRepeatEdit(id); });
    sheet.querySelector('#rDel').addEventListener('click', function(){
      if(!confirm('刪除重複設定「'+r.title+'」？\n\n已經產生的待辦不會消失，只是以後不再自動出現。')) return;
      closeOverlay();
      act('delRepeat', {id:id}, function(){
        repeats = repeats.filter(function(x){ return x.id !== id; });
      }).then(function(){ toast('已刪除重複設定'); })
        .catch(function(e){ toast(e.message); });
    });
  }

  function openRepeatEdit(id, draft){
    var r = repeatById(id);
    if(!r || !canEdit) return;
    var src = draft || r;
    var sheet = openSheet('編輯重複設定',
        '<div class="field"><label for="rTitle">要做什麼</label>'
      + '<input id="rTitle" type="text" autocomplete="off"></div>'
      + '<div class="field"><label for="rSite">分類（可留空）</label>'
      + '<input id="rSite" type="text" autocomplete="off"></div>'
      + '<div class="field"><label for="rDesc">說明（可留空）</label>'
      + '<textarea id="rDesc"></textarea></div>'
      + '<div class="sec-label">週期</div>'
      + repeatFieldsHTML('r')
      + '<label class="check"><input type="checkbox" id="rPaused"><span>暫停（先不要自動產生）</span></label>'
      + '<p class="hint">改了什麼會記在設定紀錄裡，包含原本的內容。已經產生的待辦不受影響。</p>'
      + '<div class="actions"><button class="btn btn-solid" id="rSave">儲存修改</button>'
      + '<button class="btn btn-quiet" data-close="1">取消</button></div>');

    var ti = sheet.querySelector('#rTitle'), si = sheet.querySelector('#rSite'),
        di = sheet.querySelector('#rDesc'), pa = sheet.querySelector('#rPaused');
    ti.value = src.title; si.value = src.site || ''; di.value = src.desc || '';
    pa.checked = !!src.paused;
    var fields = bindRepeatFields(sheet, 'r', src.rule || r);

    function sync(){ sheet.querySelector('#rSave').disabled = !ti.value.trim(); }
    ti.addEventListener('input', sync);
    sync();

    sheet.querySelector('#rSave').addEventListener('click', function(){
      var rule = fields.get();
      var d = { title: ti.value.trim(), site: si.value.trim(), desc: di.value.trim(),
                paused: pa.checked, rule: rule };
      if(!d.title){ toast('標題不能空白'); return; }
      var payload = { id:id, title:d.title, site:d.site, desc:d.desc, paused:d.paused,
                      freq:rule.freq, cal:rule.cal, weekday:rule.weekday, month:rule.month, day:rule.day };
      closeOverlay();
      act('editRepeat', payload, function(){
        repeats = repeats.map(function(x){
          if(x.id !== id) return x;
          var y = {}; for(var k in x) y[k] = x[k];
          y.title = d.title; y.site = d.site; y.desc = d.desc; y.paused = d.paused;
          y.label = ruleLabel(rule);
          return y;
        });
      }).then(function(){ openRepeat(id); toast('重複設定已更新'); })
        .catch(function(e){ toast(e.message + '，剛才改的內容還在'); if(canEdit) openRepeatEdit(id, d); });
    });
  }

  /* ---------- 加到主畫面的指引 ---------- */
  function env(){
    var ua = navigator.userAgent || '';
    return {
      inApp: /\bLine\//i.test(ua) || /FBAN|FBAV/i.test(ua) || /Instagram/i.test(ua),
      appName: /\bLine\//i.test(ua) ? 'LINE' : (/Instagram/i.test(ua) ? 'Instagram'
               : (/FBAN|FBAV/i.test(ua) ? 'Facebook' : '這個 App')),
      ios: /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1),
      android: /Android/i.test(ua),
      installed: window.navigator.standalone === true ||
                 (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
    };
  }

  function openGuide(){
    var e = env();
    var body;

    if(e.installed){
      body = '<p>這個板子已經是從主畫面開的了，名字會一直記著，不用再設定。</p>';
    } else {
      var addSteps = e.android
        ? '<li><b>點右上角的「⋮」</b>（三個點）</li>'
          + '<li>選<b>「加到主畫面」</b>或<b>「安裝應用程式」</b></li>'
          + '<li>按<b>「新增」</b>確認</li>'
        : e.ios
        ? '<li><b>點畫面正下方的分享鈕</b>（方框加一個向上的箭頭）</li>'
          + '<li>往下滑，找到<b>「加入主畫面」</b></li>'
          + '<li>按右上角<b>「新增」</b></li>'
        : '<li>在手機瀏覽器打開這一頁</li>'
          + '<li>iPhone：點下方分享鈕 →「加入主畫面」<br>Android：點右上角「⋮」→「加到主畫面」</li>';

      body = e.inApp
        ? '<p>你現在是在 <b>' + esc(e.appName) + ' 的內建瀏覽器</b>裡看這一頁。'
          + '這種瀏覽器會把記住的名字清掉，也沒辦法直接加到主畫面，所以要先換一個瀏覽器。</p>'
          + '<div class="sec-label">第一步 · 換到正常瀏覽器</div>'
          + '<ol class="steps"><li>點畫面角落的<b>「⋯」</b>選單</li>'
          + '<li>選<b>「用其他瀏覽器開啟」</b>（或「在 Safari 中開啟」）</li></ol>'
          + '<p class="hint">找不到那個選項的話，按下面的「複製網址」，再自己貼到 Safari 或 Chrome。</p>'
          + '<div class="sec-label">第二步 · 加到主畫面</div>'
          + '<ol class="steps">' + addSteps + '</ol>'
        : '<p>把板子放到主畫面之後，名字就會一直記著，不用每次回 LINE 找連結。</p>'
          + '<ol class="steps">' + addSteps + '</ol>';

      body += '<p>之後從主畫面的圖示打開就好，用起來跟一般 App 一樣。</p>';
    }

    var g = document.createElement('div');
    g.className = 'gate guide';
    g.innerHTML = '<div class="inner"><h2>加到手機主畫面</h2>' + body
      + '<div class="form-actions"><button class="btn btn-solid" id="guideClose">知道了</button>'
      + '<button class="btn btn-quiet" id="guideCopy">複製網址</button></div></div>';
    document.body.appendChild(g);

    g.querySelector('#guideClose').addEventListener('click', function(){ g.remove(); });
    g.querySelector('#guideCopy').addEventListener('click', function(){
      var url = location.href.split('#')[0];
      var done = function(){ toast('網址複製好了，貼到瀏覽器就行'); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(done, function(){ fallbackCopy(url, done); });
      } else {
        fallbackCopy(url, done);
      }
    });
  }

  function fallbackCopy(text, done){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); done(); }
    catch(e){ toast('複製失敗，請手動複製網址列'); }
    ta.remove();
  }

  /* ---------- 名字 ---------- */
  function askName(first){
    var others = people.filter(function(n){ return n !== me; });
    var g=document.createElement('div');
    g.className='gate';
    g.innerHTML='<div class="inner"><h2>'+(first?'你是誰？':'改個名字')+'</h2>'
      +'<p>名字會記在每一筆待辦和完工紀錄上，讓大家知道是誰做的。</p>'
      +(others.length
          ? '<div class="people">'
            + others.map(function(n,i){
                return '<button data-pick="'+i+'">'+esc(n)+'</button>';
              }).join('')
            + '</div><p class="or">或輸入新名字</p>'
          : '')
      +'<div class="field"><label for="gName">顯示名稱</label>'
      +'<input id="gName" type="text" maxlength="12" value="'+esc(me)+'"></div>'
      +'<div class="form-actions"><button class="btn btn-solid" id="gGo">開始使用</button>'
      +(first?'':'<button class="btn btn-quiet" id="gCancel">取消</button>')+'</div>'
      +(first && others.length
          ? '<p class="tip">每次進來都要重選？<button id="gHowto">把板子加到主畫面</button>就會記住你。</p>'
          : '')
      +(first ? '' : '<p class="tip"><button id="gLogout">退出編輯模式</button>（這台手機會忘記編輯密碼，回到唯讀）</p>')
      +'</div>';
    document.body.appendChild(g);

    var input=g.querySelector('#gName');
    if(!others.length) setTimeout(function(){ input.focus(); },60);

    function use(v){
      v = String(v||'').trim();
      if(!v){ toast('先輸入名字'); return; }
      me = v.slice(0,12);
      keep('boardName', me);
      applyMode();
      g.remove();
    }
    g.querySelectorAll('[data-pick]').forEach(function(b){
      b.addEventListener('click', function(){
        use(others[parseInt(b.getAttribute('data-pick'),10)]);
      });
    });
    g.querySelector('#gGo').addEventListener('click', function(){ use(input.value); });
    input.addEventListener('keydown', function(e){
      if(e.key==='Enter' && !e.isComposing && e.keyCode !== 229) use(input.value);
    });
    var c=g.querySelector('#gCancel');
    if(c) c.addEventListener('click', function(){ g.remove(); });
    var h=g.querySelector('#gHowto');
    if(h) h.addEventListener('click', openGuide);
    var lo=g.querySelector('#gLogout');
    if(lo) lo.addEventListener('click', function(){
      g.remove();
      canEdit = false; pw = ''; keep('boardPw', '');
      applyMode();
      toast('已回到唯讀');
    });
  }

  /* ---------- 新增待辦 ---------- */
  var composerFields = null;

  function syncComposer(){
    var on = $('fRepeat').checked;
    $('repeatBox').hidden = !on;
    if(on && composerFields) composerFields.sync();
    $('fSave').textContent = on ? '建立重複設定' : '加入待辦';
    $('fSave').disabled = !$('fTitle').value.trim();
  }

  function resetForm(){
    $('fTitle').value=''; $('fSite').value=''; $('fDesc').value='';
    $('fRepeat').checked = false;
    syncComposer();
  }

  function restoreDraft(d){
    $('fTitle').value = d.title; $('fSite').value = d.site; $('fDesc').value = d.desc;
    $('fRepeat').checked = !!d.repeating;
    $('form').classList.add('open');
    syncComposer();
  }

  function addTask(){
    var title=$('fTitle').value.trim();
    if(!title){ toast('先寫要做什麼'); return; }
    var repeating = $('fRepeat').checked;
    var payload = { title:title, site:$('fSite').value.trim(), desc:$('fDesc').value.trim() };
    if(repeating){
      var r = composerFields.get();
      payload.freq = r.freq; payload.cal = r.cal; payload.weekday = r.weekday;
      payload.month = r.month; payload.day = r.day;
    }
    var draft = { title:payload.title, site:payload.site, desc:payload.desc, repeating:repeating };
    resetForm();
    $('form').classList.remove('open');

    act(repeating ? 'addRepeat' : 'add', payload, repeating ? null : function(){
      tasks = tasks.concat([{
        id: 'tmp_'+Date.now(), no: 0, title: draft.title, site: draft.site, desc: draft.desc,
        status: 'open', createdBy: whoami(), createdAt: Date.now(),
        doneBy: '', doneAt: 0, doneNote: '', deletedBy: '', deletedAt: 0,
        photos: [], logs: []
      }]);
    }).then(function(){
      if(repeating){
        var head=$('repeatHead');
        if(head.getAttribute('aria-expanded')!=='true') head.click();
        toast('重複設定已建立');
      } else {
        toast('已加入待辦');
      }
    }).catch(function(e){
      // 失敗時把剛才打的字放回去，不讓人重打
      toast(e.message + '，剛才打的內容還在');
      if(canEdit) restoreDraft(draft);
    });
  }

  /* ---------- 綁定 ---------- */
  $('addToggle').addEventListener('click', function(){
    var f=$('form');
    f.classList.toggle('open');
    if(f.classList.contains('open')){ syncComposer(); $('fTitle').focus(); }
  });
  $('fCancel').addEventListener('click', function(){
    $('form').classList.remove('open');
    resetForm();
  });
  $('fSave').addEventListener('click', addTask);
  $('fTitle').addEventListener('input', syncComposer);
  // 不綁 Enter：中文輸入法按 Enter 是要選字，不是要送出
  $('fRepeat').addEventListener('change', function(){
    if($('fRepeat').checked && !composerFields){
      $('repeatBox').innerHTML = repeatFieldsHTML('f');
      composerFields = bindRepeatFields($('repeatBox'), 'f', null);
    }
    syncComposer();
  });

  ['repeat','done','trash'].forEach(function(k){
    $(k+'Head').addEventListener('click', function(){
      var exp=this.getAttribute('aria-expanded')==='true';
      this.setAttribute('aria-expanded', exp?'false':'true');
      $(k+'List').classList.toggle('open', !exp);
    });
  });
  $('whoami').addEventListener('click', function(){
    if(canEdit) askName(false); else askPassword();
  });
  $('howto').addEventListener('click', openGuide);
  $('sync').addEventListener('click', function(){
    refresh().then(function(){ toast('已更新'); }).catch(function(e){ toast(e.message); });
  });

  document.addEventListener('click', function(e){
    var el=e.target.closest ? e.target.closest('[data-tick],[data-open],[data-close],[data-repeat]') : null;
    if(!el) return;
    if(el.hasAttribute('data-close')) return closeOverlay();
    if(el.hasAttribute('data-tick')) return askComplete(el.getAttribute('data-tick'));
    if(el.hasAttribute('data-open')) return openDetail(el.getAttribute('data-open'));
    if(el.hasAttribute('data-repeat')) return openRepeat(el.getAttribute('data-repeat'));
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape' && overlayOpen) closeOverlay();
  });

  setInterval(function(){
    if(document.hidden || overlayOpen || busy > 0) return;
    refresh().catch(function(){});
  }, 30000);

  /* ---------- 啟動 ---------- */
  if(!API){
    gate('還差一步', '<p>這個板子還不知道要去哪裡存資料。<br><br>'
      + '請打開 <code>config.js</code>，把你的 Google Apps Script 網址填進去，存檔後重新整理這一頁。</p>');
    return;
  }

  me = recall('boardName');
  pw = recall('boardPw');

  refresh().then(function(){
    $('boot').hidden = true;
    $('app').hidden = false;
    if(canEdit && !me) askName(true);
  }).catch(function(e){
    gate('打不開待辦板', '<p>'+esc(e.message)+'</p>');
  });

})();
</script>
</body>
</html>
